name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # Build-time environment variables:
          # - NEXT_PUBLIC_PRIVY_APP_ID: Required by PrivyProvider and PrivyClient during static page/route optimization.
          # - PRIVY_APP_SECRET: Placeholder for PrivyClient initialization during route module evaluation.
          # - DATABASE_URL: Dummy PostgreSQL connection string for Prisma client initialization (avoids exposing production database secrets).
          # - NEXT_PUBLIC_SITE_URL: Canonical base URL for app metadata and OpenGraph tags.
          NEXT_PUBLIC_PRIVY_APP_ID: "clerk-disabled-privy-app-id-placeholder"
          PRIVY_APP_SECRET: "placeholder-privy-app-secret"
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy?sslmode=disable"
          NEXT_PUBLIC_SITE_URL: "https://lancepay.com"

  contract-exports:
    name: Contract exports
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Run contract unit tests
        run: cargo test --workspace

      - name: Build contract WASMs
        run: cargo build --workspace --target wasm32-unknown-unknown --release

      - name: List exports and reject collisions
        run: node scripts/check-wasm-exports.mjs

      - name: Test the export parser
        run: node --test scripts/list-wasm-exports.test.mjs
