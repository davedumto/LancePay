"""
Directive Contract:
- @internal: Marks types, fields, arguments, input objects, or enums intended exclusively for backend, worker, or administrative use. Stripped from the public gateway SDL.
- @private: Marks sensitive user or security data (e.g., credentials, secrets, PII) that must never be exposed through public GraphQL clients. Stripped from the public gateway SDL.

Any AST node decorated with @internal or @private—whether declared on the same line or across multiple lines, on fields, arguments, or nested types—is pruned by the schema filtering pipeline before publication.
"""
directive @internal on FIELD_DEFINITION | OBJECT | INTERFACE | UNION | ENUM | INPUT_OBJECT | SCALAR | ARGUMENT_DEFINITION | INPUT_FIELD_DEFINITION | ENUM_VALUE
directive @private on FIELD_DEFINITION | OBJECT | INTERFACE | UNION | ENUM | INPUT_OBJECT | SCALAR | ARGUMENT_DEFINITION | INPUT_FIELD_DEFINITION | ENUM_VALUE

"""
Core user account in LancePay
"""
type User {
  id: ID!
  email: String!
  name: String
  role: String!
  privyId: String @internal
  internalFlags: [String!] @internal
  createdAt: String!
  updatedAt: String!
}

"""
Invoice representation
"""
type Invoice {
  id: ID!
  invoiceNumber: String!
  amount: String!
  currency: String!
  status: String!
  dueDate: String
  internalAuditSecret: String @internal
  createdAt: String!
}

"""
Payment transaction
"""
type Transaction {
  id: ID!
  hash: String
  amount: String!
  asset: String!
  status: String!
  timestamp: String!
}

"""
Platform internal metrics and telemetry
"""
type PlatformInternalMetrics @internal {
  id: ID!
  databaseConnections: Int!
  activeJobs: Int!
}

type Query {
  me: User
  invoice(id: ID!): Invoice
  transactions(limit: Int): [Transaction!]!
  internalHealth: PlatformInternalMetrics @internal
}
