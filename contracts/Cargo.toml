[workspace]
resolver = "2"
members = [
    "crates/shared",
    "crates/milestone-escrow",
    "crates/sep10-authenticator",
    "crates/dispute-resolution",
    "crates/gasless-handler",
    "crates/transaction-monitor",
    "crates/multisig-governance",
    "crates/path-payment",
    "crates/liquidity-rebalancer",
    "crates/trustline-handler",
    "crates/upgrade-handler",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
